<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Productos — Hielo Rosario</title>
<meta name="description" content="Hielo, bebidas, congelados, copetín y carbón. Catálogo completo de Hielo Rosario con precios de contado y cuenta corriente.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<div id="header"></div>

<main>

  <section class="cabecera">
    <div class="contenedor">
      <h1>Productos</h1>
      <p class="cabecera__bajada">
        Hielo, bebidas, congelados y todo lo que necesitás para el local o la reunión.
        Los precios son de contado. Donde dice cuenta corriente, ese es el precio financiado.
      </p>
      <div class="buscador">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="buscador" type="search" placeholder="Buscar un producto" aria-label="Buscar un producto">
      </div>
    </div>
  </section>

  <div class="barra-filtros">
    <div class="contenedor">
      <div class="chips" id="filtros"></div>
    </div>
  </div>

  <section class="seccion">
    <div class="contenedor">
      <div class="catalogo__encabezado">
        <h2 id="tituloCatalogo">Todo el catálogo</h2>
        <span class="catalogo__cuenta num" id="cuentaResultados"></span>
      </div>
      <div class="grilla-productos" id="grilla">
        <p class="cargando">Cargando productos…</p>
      </div>
    </div>
  </section>

</main>

<div id="footer"></div>

<script src="config.js"></script>
<script src="carrito.js"></script>
<script src="datos.js"></script>
<script src="layout.js"></script>
<script src="productos.js"></script>
</body>
</html>
